[build-dependencies]
winresource = "0.1"

[package]
name = "rustterm-gpui"
version = "0.1.4"
edition = "2021"
description = "RustTerm GPUI - 全功能终端客户端（GPUI Kit 版）"

[dependencies]
gpui-kit = "0.8.1"
smallvec = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "time", "fs"] }
alacritty_terminal = "0.26.0"
vte = "0.15"
portable-pty = "0.8"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
log = "0.4"
env_logger = "0.11"
rfd = "0.15"
# RDP 剪贴板文件传输：读写系统剪贴板（文本 + 文件列表 CF_HDROP）
arboard = "3"
base64 = "0.22"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
crossbeam-channel = "0.5"
# ZMODEM（rz/sz）文件收发：caller-driven 无 I/O 状态机（no_std/heapless），
# 正好嵌进 Term::pump 的每帧同步循环，不需要 async 改造。
zmodem2 = "0.7"
async-trait = "0.1"
once_cell = "1"
urlencoding = "2"

# 浏览器子窗口定位与 AI 助手 HTTP
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_System_Threading"] }
ureq = { version = "2", default-features = false, features = ["tls", "json", "gzip"] }

# 远程桌面相关（纯渲染层，后端接口预留）
# VNC/RDP/SPICE：后端零改动，仅提供帧接收接口与绘制层

# 远程桌面（真实协议实现）
# VNC：vendor 版 vnc-rs
vnc-rs = { path = "vendor/vnc-rs" }
# SPICE：vendor 版 capsaicin
capsaicin-client = { path = "vendor/capsaicin/crates/capsaicin-client" }
# RDP：vendor 版 IronRDP（Windows 用 native-tls / schannel）
# 注意：client-clipboard 必须开——vendor 版 ironrdp-client 的
# `DirectTransport` 导入被 cfg(feature="clipboard") 包住，关掉会编译失败。
ironrdp = { path = "vendor/ironrdp/crates/ironrdp", default-features = false, features = [
    "client", "client-clipboard", "client-rdpdr", "cliprdr", "connector", "core", "input", "pdu", "native-tls"
] }
# RDP 共享目录（文件传输）：RDPDR 通道 + 本地目录后端。
# 有了它，「把文件拖进远端桌面」等同于把本机某个目录挂成远端的一个盘符，
# 不用在远端额外跑任何服务。
ironrdp-rdpdr-native = { path = "vendor/ironrdp/crates/ironrdp-rdpdr-native" }

# 内置 X11 服务（src/xsrv/，设计参考主工程 docs/x11-server.md）：只复用
# x11rb-protocol 的线格式编解码与资源 ID 分配，服务端语义自己实现。
# 纯 Rust，无 C 依赖。
x11rb-protocol = { version = "0.13", default-features = false, features = [
    "std",
    "request-parsing",
    "composite",
    "damage",
    "randr",
    "render",
    "shape",
    "shm",
    "xfixes",
    "xinput",
    "xkb",
    "xtest",
] }

# 浏览器内核（wry） - 可选
wry = { version = "0.47", optional = true }

# 复用主工程已修补的 russh（SHA-1/CBC/des 等旧算法兜底，Jumpserver/老设备兼容）。
# default-features 关闭：russh 默认启用 aws-lc-rs（其 C 构建 aws-lc-sys 在本机必挂），
# 只留 ring 后端 + 手动开启的特性。
russh = { path = "vendor/russh/russh", default-features = false, features = ["des", "flate2", "ring", "rsa"] }
# SFTP 子系统（右侧 SFTP 面板需要真实列目录 / 上传下载）
russh-sftp = { path = "vendor/russh-sftp" }

[features]
default = ["browser"]
browser = ["wry"]
# 开发期工具（截图 / UI 注入 / 远程桌面探针）。
# 不在 default 里 —— `cargo build --release` 不会产出这些 exe，
# 需要时用 `cargo build --features devtools --bin snap` 单独构建。
devtools = []

[[bin]]
name = "snap"
path = "devtools/snap.rs"
required-features = ["devtools"]

[[bin]]
name = "ui"
path = "devtools/ui.rs"
required-features = ["devtools"]

[[bin]]
name = "rdprobe"
path = "devtools/rdprobe.rs"
required-features = ["devtools"]

[[bin]]
name = "vncprobe"
path = "devtools/vncprobe.rs"
required-features = ["devtools"]

[[bin]]
name = "vncpipe"
path = "devtools/vncpipe.rs"
required-features = ["devtools"]

[[bin]]
name = "rfbhello"
path = "devtools/rfbhello.rs"
required-features = ["devtools"]

[[bin]]
name = "rdpprobe"
path = "devtools/rdpprobe.rs"
required-features = ["devtools"]

[[bin]]
name = "post"
path = "devtools/post.rs"
required-features = ["devtools"]

[[bin]]
name = "ptytest"
path = "devtools/ptytest.rs"
required-features = ["devtools"]

[[bin]]
name = "x11test"
path = "devtools/x11test.rs"
required-features = ["devtools"]

[profile.dev]
# 环境限制：debug=true 会让 cc 给 MSVC 传 /Z7，随 Rust spawn 触发 cl D8050（见构建日志），
# 这里统一关掉 dev 的调试信息; 并行提升 egui 编译
debug = 0
incremental = true

[profile.dev.package."*"]
opt-level = 2

# IronRDP 依赖的 picky / sspi 需要主工程的修补版（与 russh 的 ecdsa 版本对齐）
[patch.crates-io]
picky = { path = "vendor/picky" }
sspi = { path = "vendor/sspi" }
